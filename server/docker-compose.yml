services:
  pti-server:
    build: .
    image: pti-server:0.1.0-test
    container_name: pti-server
    restart: unless-stopped
    ports:
      - "${PTI_PORT:-8000}:8000"
    volumes:
      # 数据库只在这里：宿主机 ./data 文件夹 ↔ 容器 /data，镜像里没有数据库。
      # 转移服务 = docker compose down → 拷走 ./data → 新机器上再 up。
      - ./data:/data
    env_file:
      - .env
    environment:
      - PORT=8000
      - PTI_DB_PATH=/data/pti.db
